# The value lists every home has in Ukrainian (Pack.lists): a command's value
# slot uses one by name ({list: colors}). A home's own list by the same name,
# in Ukrainian, takes its place (the Names page). Values are what Home Assistant
# gets: CSS color names, cover device classes, HVAC modes. Each is said in the
# cases and genders a sentence puts it in ("зроби світло синім", "синя лампа").
colors:
  red: [червоний, червоне, червона, червону, червоним, червоною, червоні]
  orange: [помаранчевий, помаранчеве, помаранчева, помаранчеву, помаранчевим, помаранчевою, оранжевий, оранжевим]
  yellow: [жовтий, жовте, жовта, жовту, жовтим, жовтою]
  green: [зелений, зелене, зелена, зелену, зеленим, зеленою]
  blue: [синій, синє, синя, синю, синім, синьою, блакитний, блакитне, блакитним, блакитною]
  purple: [фіолетовий, фіолетове, фіолетова, фіолетову, фіолетовим, фіолетовою, бузковий, бузковим]
  pink: [рожевий, рожеве, рожева, рожеву, рожевим, рожевою]
  white: [білий, біле, біла, білу, білим, білою]
  turquoise: [бірюзовий, бірюзове, бірюзова, бірюзову, бірюзовим, бірюзовою]
  magenta: [пурпуровий, пурпурове, пурпурова, пурпурову, пурпуровим, пурпуровою]
on_off:
  "on": [увімкнений, увімкнена, увімкнене, увімкнені, ввімкнений, ввімкнена, ввімкнене, ввімкнені, увімкнено, включений, включена, горить, працює]
  "off": [вимкнений, вимкнена, вимкнене, вимкнені, вимкнено, виключений, виключена]
media_kinds:
  # What plays (Music library): "музика" is Music Assistant's players,
  # "телевізор" the media players whose device class is tv.
  music: [музика, музику, музики]
  tv: [телевізор, телевізора, телевізорі, телевізору, телик, тв]
cover_classes:
  awning: [маркіза, маркізу, маркізи, навіс, тент]
  blind: [жалюзі]
  curtain: [штори, штору, штора, шторах, фіранки, фіранку, гардини, завіси]
  door: [двері, дверях]
  garage: [гаражні ворота, ворота гаража, гаражні двері, двері гаража, ворота в гаражі]
  gate: [ворота, хвіртку, хвіртка, браму, брама]
  shade: [рулонні штори, рулонну штору, рулонна штора, рулонних штор]
  shutter: [ролети, ролету, ролета, ролетах, ролет, віконниці, віконницю]
  window: [вікно, вікна, вікон, вікнах, кватирку, кватирка]
open_closed:
  open: [відкриті, відкрите, відкрита, відкритий, відчинені, відчинене, відчинена, відчинений, підняті, піднята]
  closed: [закриті, закрите, закрита, закритий, зачинені, зачинене, зачинена, зачинений, опущені, опущена]
locked_unlocked:
  locked: [замкнені, замкнений, замкнена, замкнене, замкнено, на ключ, на замку, заблоковані, заблокований]
  unlocked: [відімкнені, відімкнений, відімкнена, відімкнене, відімкнено, незамкнені, незамкнений, незамкнена, незамкнене, розблоковані]
color_temperatures:
  # The white, by what it is called ("зроби світло теплим білим").
  "2700": [теплий білий, тепле біле, теплим білим, теплий, тепле, теплим, теплу]
  "3000": [м'який білий, м'яке біле, м'яким білим, м'який, м'яке, м'яким]
  "4000": [нейтральний білий, нейтральне біле, нейтральним білим, нейтральний, нейтральне, нейтральним, природний, природним]
  "5000": [холодний білий, холодне біле, холодним білим, холодний, холодне, холодним]
  "6500": [денний, денне, денним, як удень]
forecast_days:
  # "На" and "у" before them are filler: "на завтра", "у суботу".
  today: [сьогодні]
  tomorrow: [завтра]
  day_after_tomorrow: [післязавтра]
  monday: [понеділок, понеділка]
  tuesday: [вівторок, вівторка]
  wednesday: [середа, середу, середи]
  thursday: [четвер, четверга]
  friday: [п'ятниця, п'ятницю, п'ятниці]
  saturday: [субота, суботу, суботи]
  sunday: [неділя, неділю, неділі]
  weekend: [вихідні, вихідних, ці вихідні]
weather_kinds:
  rain: [дощ, дощу, дощик, дощитиме, парасолька, парасольку, парасоля, опади, опадів]
  snow: [сніг, снігу, сніжитиме, снігопад]
fan_modes:
  auto: [авто, автоматичний, автоматичному, автоматично]
  "on": [увімкнено, увімкнений, постійно, завжди увімкнений]
  "off": [вимкнено, вимкнений]
  low: [низький, низька, низьку, мінімальний, мінімальну]
  medium: [середній, середня, середню]
  high: [високий, висока, високу, максимальний, максимальну]
  circulate: [циркуляція, циркуляцію, циркуляції]
  # Both at once, where a thermostat's modes are ("on_low", "auto_high").
  auto_low: [авто низький, авто низька]
  auto_medium: [авто середній, авто середня]
  auto_high: [авто високий, авто висока]
  on_low: [постійно низький, постійно низька]
  on_medium: [постійно середній, постійно середня]
  on_high: [постійно високий, постійно висока]
binary_states:
  # What a binary sensor is asked to be ("чи відчинені вхідні двері"): the
  # words for each of its device classes' two states (Sensors library group).
  # Not locked or unlocked: "чи замкнені вхідні двері" is the lock's (Covers
  # and locks), which asks a binary sensor of the lock class too.
  "on": [увімкнений, увімкнена, увімкнене, увімкнено]
  "off": [вимкнений, вимкнена, вимкнене, вимкнено]
  open: [відкритий, відкрита, відкрите, відкриті, відчинений, відчинена, відчинене, відчинені]
  closed: [закритий, закрита, закрите, закриті, зачинений, зачинена, зачинене, зачинені]
  wet: [мокрий, мокра, мокре, вологий, волога, протікає, тече]
  dry: [сухий, суха, сухе]
  occupied: [зайнятий, зайнята, зайняте]
  clear: [вільний, вільна, вільне, порожній, порожня, порожнє]
  home: [вдома, удома]
  away: [не вдома, відсутній, відсутня]
  connected: [підключений, підключена, підключене, онлайн, в мережі]
  disconnected: [відключений, відключена, відключене, офлайн, не в мережі]
  running: [працює]
  charging: [заряджається]
  plugged in: [у розетці, в розетці, увімкнений у розетку]
  unplugged: [не в розетці, вимкнений з розетки]
  low: [низький, низька, низьке, розряджений, розряджена, сідає]
  cold: [холодний, холодна, холодне, холодно]
  hot: [гарячий, гаряча, гаряче, жарко, спекотно]
hvac_modes:
  "off": [вимкнено, вимкнений]
  heat: [обігрів, нагрів, обігріву, опалення]
  cool: [охолодження, кондиціонер]
  heat_cool: [обігрів і охолодження]
  auto: [авто, автоматичний, автоматичному]
  dry: [осушення]
  fan_only: [вентиляція, лише вентилятор, тільки вентилятор]
everywhere:
  # Where an announcement goes when no area or floor is said: only with one of
  # these.
  everywhere: [скрізь, всюди, усюди, всім, усім, всьому будинку, усьому будинку, всіх кімнатах, усіх кімнатах]
