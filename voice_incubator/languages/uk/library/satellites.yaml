# The satellites (Ukrainian), as the English library's satellites.yaml:
# announcements between them, the intercom, a satellite's own volume, and
# never mind.
#
# An announcement is said on the other satellites, after a chime: those in the
# area or on the floor named, or every one when that is said ("everywhere").
# One in a call, ringing a timer or joined by the intercom says it once that is
# over (within a minute).
#
# The intercom joins this satellite and the one in the area named, once this
# call ends: what is said at each is heard at the other. Both stop answering
# wake words and blink their rings until the button on either is pressed (or
# after half an hour). Both need firmware that can. The area is said with "з"
# in the instrumental ("з'єднай з кухнею") or "на" in the accusative
# ("подзвони на кухню").
title: Satellites
icon: mdi:speaker-wireless

# Commands shown together in Add a command: each one's topic.
topics:
  own_volume: {title: Satellite volume, icon: mdi:volume-equal}

commands:
  announce:
    title: Announce
    icon: mdi:bullhorn
    description: оголосити щось на інших пристроях
    # In the area or on the floor said, before or after the message: "оголоси на
    # кухні, що вечеря готова", "оголоси, що вечеря готова, на кухні". Every one
    # only when said: "скажи всім, що вечеря готова", "оголоси по всьому
    # будинку, що вечеря готова".
    require: [[оголоси, оголосіть, скажи, скажіть, повідом, передай]]
    optional: [[що], [на, в, у, до, по]]
    names:
      area: {count: 1}
      floor: {count: 1}
    lists:
      everywhere: {list: everywhere}
    combinations: [[area, message], [floor, message], [everywhere, message]]
    wildcard:
      slot: message
      after: [оголоси, оголосіть, скажи, скажіть, повідом, передай, що]
      to_end: true
      max_words: 15
    announce: "{{ slots.message }}"

  intercom:
    title: Intercom
    icon: mdi:phone-in-talk
    description: поговорити з іншою кімнатою через її пристрій
    # "З'єднай з кухнею", "подзвони на кухню", "інтерком у спальню",
    # "зв'яжися з кабінетом", "з'єднай мене з пристроєм у вітальні".
    require: [[з'єднай, з'єднайте, подзвони, подзвоніть, зателефонуй, зв'яжись, зв'яжися, інтерком]]
    optional: [[мене, нас], [з, зі, із, на, до, в, у], [пристроєм, пристрій, колонкою, колонку]]
    names:
      area: {count: 1}
    intercom: connect
    needs:
      - Give the satellites their areas (each one's page), and the areas names
        (Names page). The button on either satellite ends it.

  # The satellite's own speaker, whatever plays on it: what its dial sets.
  own_volume_up:
    title: Turn yourself up
    topic: own_volume
    icon: mdi:volume-plus
    description: зробити гучнішим власний звук пристрою
    examples: [говори голосніше, говори гучніше, "збільш свою гучність", "зроби себе гучніше"]
    require: [[говори голосніше, говори гучніше, говоріть голосніше, говоріть гучніше, розмовляй голосніше,
               збільш свою гучність, підвищ свою гучність, зроби себе гучніше, зроби себе голосніше]]
    action:
      action: media_player.volume_up
      target:
        entity_id: "{{ satellite.device_media_player }}"
    verbosity: beep

  own_volume_down:
    title: Turn yourself down
    topic: own_volume
    icon: mdi:volume-minus
    description: зробити тихішим власний звук пристрою
    examples: [говори тихіше, "зменш свою гучність", "зроби себе тихіше"]
    require: [[говори тихіше, говоріть тихіше, розмовляй тихіше, зменш свою гучність, знизь свою гучність,
               зроби себе тихіше]]
    action:
      action: media_player.volume_down
      target:
        entity_id: "{{ satellite.device_media_player }}"
    verbosity: beep

  own_volume_set:
    title: Set your volume
    topic: own_volume
    icon: mdi:volume-equal
    description: встановити власну гучність пристрою
    # "Встанови свою гучність на п'ятдесят відсотків", "зроби себе на
    # тридцять".
    require: [[свою гучність, твою гучність, власну гучність, себе]]
    optional: [[встанови, встановіть, постав, зроби, зміни], [на, до], [відсотків, відсотки, відсоток, відсотка]]
    number: percentage
    action:
      action: media_player.volume_set
      target:
        entity_id: "{{ satellite.device_media_player }}"
      data:
        volume_level: "{{ slots.percentage / 100 }}"
    verbosity: beep
    response:
      done:
        brief: Готово.
        specific: >-
          {%- set p = slots.percentage | int -%}
          Моя гучність: {{ p }} {{ 'відсоток' if p % 10 == 1 and p % 100 != 11 else ('відсотки' if p % 10 in [2, 3, 4]
            and p % 100 not in [12, 13, 14] else 'відсотків') }}.

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: нічого не робити
    # Said whole only: "скасуй таймер" is the timer's. Nothing to do, and by
    # default nothing said, not even a sound: the satellite stops listening.
    # Give it a response (Only respond) or a beep to hear that it did.
    # "Забути": "забудь" as the model often writes it.
    examples: [забудь, "забудь [про це]", забути, нічого, не треба, "нічого не треба", скасуй, відміна, неважливо,
               проїхали]
