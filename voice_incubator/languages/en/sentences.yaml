# Kaldi mode's sentences for the library's commands (commands.py
# ``sentences``; voice_incubator/kaldi_mode.py), by library command: file/id, a
# family's version with its variant (lights/turn_on_place). Each is a
# template, with the slots it hears in braces -- one way of saying the
# command whole -- and every word in it one the command's keywords, names,
# number or values explain (or a filler: the, a, my, please ...), so that
# what Kaldi hears reads back as the command (tests/test_kaldi_mode.py).
# Lean on purpose: Kaldi hears only these, and every alternative is one more
# sentence to mistake another for. Parakeet never reads them.

# ------------------------------------------------------------------ climate
climate/set_temperature_here:
  - set [the] (temperature|thermostat|heat) to {temperature} [degrees]
  - (set|turn) the heat to {temperature} [degrees]
climate/set_temperature_device:
  - set [the] {entity} to {temperature} [degrees]
  - set [the] {entity} temperature to {temperature} [degrees]
  - set [the] {entity} in [the] {area} to {temperature} [degrees]
climate/heat_up:
  - (turn up|raise|increase) the (heat|heating|temperature|thermostat) [a (bit|little)]
  - turn the (heat|heating|temperature|thermostat) up [a (bit|little)]
climate/heat_down:
  - (turn down|lower|decrease) the (heat|heating|temperature|thermostat) [a (bit|little)]
  - turn the (heat|heating|temperature|thermostat) down [a (bit|little)]
climate/set_thermostat_mode:
  - (set|switch|change|put) [the] thermostat [mode] to {mode}
  - turn [the] thermostat to {mode}
climate/set_thermostat_fan:
  - set [the] thermostat fan to {mode}
  - set [the] fan mode to {mode}

