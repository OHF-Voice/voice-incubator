# The satellites (Russian), as the English library's satellites.yaml:
# announcements between them, the intercom, a satellite's own volume, and
# never mind.
#
# An announcement is said on the other satellites, after a chime: those in the
# area or on the floor named, or every one when that is said ("everywhere").
# One in a call, ringing a timer or joined by the intercom says it once that is
# over (within a minute).
#
# The intercom joins this satellite and the one in the area named, once this
# call ends: what is said at each is heard at the other ("соедини с кухней":
# the area in the instrumental, or "позвони на кухню"). Both stop answering
# wake words and blink their rings until the button on either is pressed (or
# after half an hour). Both need firmware that can.
title: Satellites
icon: mdi:speaker-wireless

# Commands shown together in Add a command: each one's topic.
topics:
  own_volume: {title: Satellite volume, icon: mdi:volume-equal}

commands:
  announce:
    title: Announce
    icon: mdi:bullhorn
    description: сделать объявление на других устройствах
    # In the area or on the floor said, before or after the message: "объяви на
    # кухне, что ужин готов", "объяви, что ужин готов, на кухне". Every one only
    # when said: "скажи всем, что ужин готов", "объяви по всему дому, что ужин
    # готов".
    require: [[объяви, объявите, сделай объявление, сделайте объявление, скажи, скажите, сообщи, сообщите,
               передай]]
    optional: [[что], [в, во, на, по]]
    names:
      area: {count: 1}
      floor: {count: 1}
    lists:
      everywhere: {list: everywhere}
    combinations: [[area, message], [floor, message], [everywhere, message]]
    wildcard:
      slot: message
      after: [объяви, объявите, сделай объявление, сделайте объявление, скажи, скажите, сообщи, сообщите,
              передай, что]
      to_end: true
      max_words: 15
    announce: "{{ slots.message }}"

  intercom:
    title: Intercom
    icon: mdi:phone-in-talk
    description: поговорить с другой комнатой через её устройство
    # "Соедини с кухней", "позвони на кухню", "свяжись с кабинетом",
    # "интерком в спальню", "соедини меня с колонкой в гостиной".
    require: [[соедини, соедините, позвони, позвоните, свяжись, свяжитесь, свяжи, интерком]]
    optional: [[меня, нас], [с, со], [колонкой, устройством, ассистентом]]
    names:
      area: {count: 1}
    intercom: connect
    needs:
      - Give the satellites their areas (each one's page), and the areas names
        (Names page). The button on either satellite ends it.

  # The satellite's own speaker, whatever plays on it: what its dial sets.
  own_volume_up:
    title: Turn yourself up
    topic: own_volume
    icon: mdi:volume-plus
    description: сделать громче голос самого устройства
    examples: [говори громче, говори погромче, сделай свой голос громче, прибавь свою громкость]
    require: [[говори громче, говори погромче, говорите громче, свой голос громче, прибавь свою громкость,
               увеличь свою громкость]]
    action:
      action: media_player.volume_up
      target:
        entity_id: "{{ satellite.device_media_player }}"
    verbosity: beep

  own_volume_down:
    title: Turn yourself down
    topic: own_volume
    icon: mdi:volume-minus
    description: сделать тише голос самого устройства
    examples: [говори тише, говори потише, сделай свой голос тише, убавь свою громкость]
    require: [[говори тише, говори потише, говорите тише, свой голос тише, убавь свою громкость,
               уменьши свою громкость]]
    action:
      action: media_player.volume_down
      target:
        entity_id: "{{ satellite.device_media_player }}"
    verbosity: beep

  own_volume_set:
    title: Set your volume
    topic: own_volume
    icon: mdi:volume-equal
    description: изменить громкость самого устройства
    # Also turned up or down to a number: "поставь свою громкость на 50".
    require: [[свою громкость, своей громкости, свой голос, твою громкость, громкость своего голоса]]
    optional: [[поставь, установи, сделай, выставь, измени, прибавь, убавь], [на, до], [процентов, процента, процент]]
    number: percentage
    action:
      action: media_player.volume_set
      target:
        entity_id: "{{ satellite.device_media_player }}"
      data:
        volume_level: "{{ slots.percentage / 100 }}"
    verbosity: beep
    response:
      done:
        brief: Готово.
        specific: >-
          {%- set p = slots.percentage | int -%}
          Моя громкость: {{ p }} {{ 'процент' if p % 10 == 1 and p % 100 != 11 else
          ('процента' if p % 10 in [2, 3, 4] and (p % 100 < 12 or p % 100 > 14) else 'процентов') }}.

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: ничего не делать
    # Said whole only: "отмени таймер" is the timer's. Nothing to do, and by
    # default nothing said, not even a sound: the satellite stops listening.
    # Give it a response (Only respond) or a beep to hear that it did.
    examples: [неважно, забудь, отмена, отмени, ничего, не надо, проехали, забей, ничего не надо]
