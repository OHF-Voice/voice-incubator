# Satellites (French), as the English library's satellites.yaml: announcements
# between them, the intercom, a satellite's own volume, and never mind.
#
# An announcement is said on the other satellites, after a chime: those in the
# area or on the floor named, or every one when that is said ("everywhere").
# One in a call, ringing a timer or joined by the intercom says it once that is
# over (within a minute).
#
# The intercom joins this satellite and the one in the area named, once this
# call ends: what is said at each is heard at the other. Both stop answering
# wake words and blink their rings until the button on either is pressed (or
# after half an hour). Both need firmware that can.
title: Satellites
icon: mdi:speaker-wireless

# Commands shown together in Add a command: each one's topic.
topics:
  own_volume: {title: Satellite volume, icon: mdi:volume-equal}

commands:
  announce:
    title: Announce
    icon: mdi:bullhorn
    description: faire une annonce sur les autres satellites
    # In the area or on the floor said, before or after the message: "annonce
    # dans la cuisine que le dîner est prêt", "annonce que le dîner est prêt
    # dans la cuisine". Every one only when said: "dis à tout le monde que le
    # dîner est prêt", "annonce partout que le dîner est prêt".
    require: [[annonce, diffuse, dis, préviens]]
    optional: [[que], [dans, sur, à, au]]
    names:
      area: {count: 1}
      floor: {count: 1}
    lists:
      everywhere: {list: everywhere}
    combinations: [[area, message], [floor, message], [everywhere, message]]
    wildcard:
      slot: message
      after: [annonce, diffuse, dis, préviens, que]
      to_end: true
      max_words: 15
    announce: "{{ slots.message }}"

  intercom:
    title: Intercom
    icon: mdi:phone-in-talk
    description: parler avec une autre pièce par son satellite
    # "Connecte-moi à la cuisine", "interphone la cuisine", "appelle le
    # satellite de la cuisine", "connecte-toi à l'assistant vocal du bureau".
    require: [[connecte, connecte moi, connecte toi, interphone, appelle, mets moi en relation]]
    optional: [[à, avec, au], [assistant vocal, satellite], [dans, de, du]]
    names:
      area: {count: 1}
    intercom: connect
    needs:
      - Give the satellites their areas (each one's page), and the areas names
        (Names page). The button on either satellite ends it.

  # The satellite's own speaker, whatever plays on it: what its dial sets.
  own_volume_up:
    title: Turn yourself up
    topic: own_volume
    icon: mdi:volume-plus
    description: monter le volume du satellite
    examples: [parle plus fort, monte ton volume, augmente ton volume, parle plus fort s'il te plaît]
    require: [[monte ton volume, augmente ton volume, ton volume plus fort, parle plus fort, parlez plus fort]]
    action:
      action: media_player.volume_up
      target:
        entity_id: "{{ satellite.device_media_player }}"
    verbosity: beep

  own_volume_down:
    title: Turn yourself down
    topic: own_volume
    icon: mdi:volume-minus
    description: baisser le volume du satellite
    examples: [parle moins fort, baisse ton volume, diminue ton volume, parle plus doucement]
    require: [[baisse ton volume, diminue ton volume, ton volume moins fort, parle moins fort, parlez moins fort, parle plus doucement]]
    action:
      action: media_player.volume_down
      target:
        entity_id: "{{ satellite.device_media_player }}"
    verbosity: beep

  own_volume_set:
    title: Set your volume
    topic: own_volume
    icon: mdi:volume-equal
    description: régler le volume du satellite
    # Also turned up or down to a number: "monte ton volume à 50".
    require: [[ton volume, votre volume]]
    optional: [[mets, mais, règle, change, monte, baisse], [à, sur], [pour cent]]
    number: percentage
    action:
      action: media_player.volume_set
      target:
        entity_id: "{{ satellite.device_media_player }}"
      data:
        volume_level: "{{ slots.percentage / 100 }}"
    verbosity: beep
    response:
      done:
        brief: C'est fait.
        specific: Mon volume est à {{ slots.percentage }} pour cent.

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: ne rien faire
    # Said whole only: "annule le minuteur" is the timer's. Nothing to do, and
    # by default nothing said, not even a sound: the satellite stops listening.
    # Give it a response (Only respond) or a beep to hear that it did.
    examples: [laisse tomber, oublie, annule, rien, c'est pas grave]
