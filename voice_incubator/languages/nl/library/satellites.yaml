# Satellites (Dutch), as the English library's satellites.yaml: announcements
# between them, the intercom, a satellite's own volume, and never mind.
#
# An announcement is said on the other satellites, after a chime: those in the
# area or on the floor named, or every one when that is said ("everywhere").
# One in a call, ringing a timer or joined by the intercom says it once that is
# over (within a minute).
#
# The intercom joins this satellite and the one in the area named, once this
# call ends: what is said at each is heard at the other. Both stop answering
# wake words and blink their rings until the button on either is pressed (or
# after half an hour). Both need firmware that can.
title: Satellites
icon: mdi:speaker-wireless

# Commands shown together in Add a command: each one's topic.
topics:
  own_volume: {title: Satellite volume, icon: mdi:volume-equal}

commands:
  announce:
    title: Announce
    icon: mdi:bullhorn
    description: iets omroepen op de andere satellieten
    # In the area or on the floor said, before or after the message: "omroepen
    # in de keuken dat het eten klaar is", "kondig aan dat het eten klaar is in
    # de keuken". Every one only when said: "vertel iedereen dat het eten klaar
    # is", "omroepen in het hele huis dat het eten klaar is".
    require: [[omroepen, roep om, kondig aan, aankondigen, vertel, zeg tegen, laat ... weten]]
    optional: [[dat], [in, op, naar], [de, het]]
    names:
      area: {count: 1}
      floor: {count: 1}
    lists:
      everywhere: {list: everywhere}
    combinations: [[area, message], [floor, message], [everywhere, message]]
    wildcard:
      slot: message
      after: [omroepen, roep om, kondig aan, aankondigen, vertel, zeg tegen, dat]
      to_end: true
      max_words: 15
    announce: "{{ slots.message }}"

  intercom:
    title: Intercom
    icon: mdi:phone-in-talk
    description: met een andere kamer praten via de satelliet daar
    # "Verbind me met de keuken", "intercom de keuken", "bel de keuken", "bel
    # de spraakassistent in het kantoor".
    require: [[verbind, verbinden, intercom, bel]]
    optional: [[me, mij], [met, naar], [de, het], [spraakassistent, satelliet], [in]]
    names:
      area: {count: 1}
    intercom: connect
    needs:
      - Give the satellites their areas (each one's page), and the areas names
        (Names page). The button on either satellite ends it.

  # The satellite's own speaker, whatever plays on it: what its dial sets.
  own_volume_up:
    title: Turn yourself up
    topic: own_volume
    icon: mdi:volume-plus
    description: het volume van de satelliet zelf harder zetten
    examples: [praat harder, spreek harder, zet jezelf harder, zet je volume hoger]
    require: [[zet jezelf harder, zet je volume hoger, zet je volume harder, je volume omhoog, praat harder, spreek harder,
               praat luider, spreek luider]]
    action:
      action: media_player.volume_up
      target:
        entity_id: "{{ satellite.device_media_player }}"
    verbosity: beep

  own_volume_down:
    title: Turn yourself down
    topic: own_volume
    icon: mdi:volume-minus
    description: het volume van de satelliet zelf zachter zetten
    examples: [zet jezelf zachter, zet je volume lager, praat zachter, spreek zachter]
    require: [[zet jezelf zachter, zet je volume lager, zet je volume zachter, je volume omlaag, praat zachter, spreek zachter,
               praat stiller, spreek stiller]]
    action:
      action: media_player.volume_down
      target:
        entity_id: "{{ satellite.device_media_player }}"
    verbosity: beep

  own_volume_set:
    title: Set your volume
    topic: own_volume
    icon: mdi:volume-equal
    description: het volume van de satelliet zelf instellen
    # Also turned up or down to a number: "zet jezelf harder op 50".
    require: [[je volume, jouw volume, jezelf]]
    optional: [[zet, verander, maak, draai], [harder, zachter, hoger, lager], [op, naar], [procent]]
    exclude: [met]
    number: percentage
    action:
      action: media_player.volume_set
      target:
        entity_id: "{{ satellite.device_media_player }}"
      data:
        volume_level: "{{ slots.percentage / 100 }}"
    verbosity: beep
    response:
      done:
        brief: Klaar.
        specific: Mijn volume staat op {{ slots.percentage }} procent.

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: niets doen
    # Said whole only: "annuleer de timer" is the timer's. Nothing to do, and by
    # default nothing said, not even a sound: the satellite stops listening.
    # Give it a response (Only respond) or a beep to hear that it did.
    examples: [laat maar, laat maar zitten, vergeet het, annuleer, niets, niks]
