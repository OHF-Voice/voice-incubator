  - ["Wat is de ventilatorstand?", thermostat_fan, {}, "the fan, asked"]
  # Covers to a position.
  - ["Zet de rolluiken op vijftig procent.", cover_position_here, {device_class: shutter, percentage: 50}, "by type, a number"]
  - ["Zet het dakraam op dertig procent.", cover_position_device, {entity: [cover.dakraam], percentage: 30}, "by name, a number"]
  # Lights by a step, and their white.
  - ["Maak het licht in de woonkamer feller.", brighter_place, {area: [woonkamer]}, "brighter, an area"]
