  - ["Maak het een beetje lichter.", brighter_here, {}, "an example sentence"]
  - ["Zet de staande lamp op warm wit.", light_temperature_device, {entity: [light.staande_lamp], color_temperature: "2700"}, "a white by name"]
  - ["Dim het licht naar twintig procent.", set_brightness_here, {percentage: 20}, "dimmed to a number"]
  # Music: the kind, and the speaker's own playlist.
  - ["Pauzeer de tv.", pause_music_here, {kind: tv}, "the TV"]
  - ["Zet de tv zachter.", volume_down_here, {kind: tv}, "the TV, quieter"]
  - ["Speel mijn afspeellijst.", play_my_playlist, {}, "an example sentence"]
  # Satellites.
  - ["Vertel iedereen dat we gaan eten.", announce, {everywhere: everywhere, message: we gaan eten}, "free text to the end"]
  - ["Kondig aan dat we gaan eten in de keuken.", announce, {area: [keuken], message: we gaan eten}, "an area last"]
  - ["Verbind me met de keuken.", intercom, {area: [keuken]}, "an area"]
  - ["Praat harder.", own_volume_up, {}, "its own volume"]
  - ["Zet je volume op veertig procent.", own_volume_set, {percentage: 40}, "its own volume, a number"]
  # People and sensors.
  - ["Wie ben ik?", who_am_i, {}, "an example sentence"]
  - ["Wat is de buitentemperatuur?", sensor_value, {entity: [sensor.buitentemperatuur]}, "a sensor by name"]
  - ["Is de achterdeur open?", binary_sensor_state, {entity: [binary_sensor.achterdeur], asked: open}, "a binary sensor, asked"]
