  - ["Annuleer de timer.", cancel_timer, {}, "a timer"]
  - ["Hoe lang loopt de timer nog?", timer_status, {}, "a timer question"]
  - ["Laat maar.", never_mind, {}, "an example sentence"]
  # Climate: the home's thermostat.
  - ["Zet de temperatuur op twintig graden.", set_temperature_here, {temperature: 20}, "the home's thermostat"]
  - ["Zet de verwarming hoger.", heat_up, {}, "a step up"]
  - ["Zet de verwarming lager.", heat_down, {}, "a step down"]
  - ["Waar staat de thermostaat op?", thermostat, {}, "an example sentence"]
  - ["Hoe warm is het binnen?", thermostat, {}, "inside"]
  - ["Zet de thermostaat op koelen.", set_thermostat_mode, {mode: cool}, "a mode"]
  - ["In welke modus staat de thermostaat?", thermostat_mode, {}, "the mode, asked"]
