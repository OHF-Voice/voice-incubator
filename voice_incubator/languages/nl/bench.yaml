  - ["Gaat het zaterdag regenen?", will_it_rain, {what: rain, day: saturday}, "rain on a day"]
  - ["Gaat het morgen sneeuwen?", will_it_rain, {what: snow, day: tomorrow}, "snow"]
  - ["Wat staat er vandaag in mijn agenda?", my_calendar, {}, "an example sentence"]
