  - ["Usuń pranie z mojej listy zadań.", todo_remove_mine, {item: pranie}, "taken off the speaker's own"]
  - ["Co jest na mojej liście zadań?", todo_items_mine, {}, "the speaker's own, read"]
  # The weather.
  - ["Jaka jest dzisiaj pogoda?", weather, {}, "now"]
  - ["Jaka będzie pogoda jutro?", weather_day, {day: tomorrow}, "a day"]
  - ["Jaka będzie pogoda w weekend?", weather_day, {day: weekend}, "the weekend"]
  - ["Jaka będzie pogoda w tym tygodniu?", weather_week, {}, "the week"]
  - ["Czy jutro będzie padać?", will_it_rain, {day: tomorrow, what: rain}, "rain, a day"]
  - ["Czy w sobotę spadnie śnieg?", will_it_rain, {day: saturday, what: snow}, "snow"]
  # Alarms and reminders on the calendar (an alarm's or reminder's time is
  # compared by when the calendar reads it, on a Wednesday afternoon).
  - ["Ustaw budzik na jutro na siódmą trzydzieści.", set_alarm, {time: jutro na siódmą trzydzieści}, "the day, then the time"]
  - ["Ustaw budzik na siódmą trzydzieści.", set_alarm, {time: "19:30"}, "the next 7:30 to come"]
  - ["Obudź mnie jutro o szóstej piętnaście.", set_alarm, {time: jutro o 6:15}, "obudź mnie, o + locative"]
  - ["Ustaw budzik na wpół do siódmej jutro.", set_alarm, {time: jutro 6:30}, "wpół do: half before"]
  - ["Ustaw budzik na za kwadrans siódma jutro.", set_alarm, {time: jutro 6:45}, "za kwadrans: a quarter before"]
  - ["Ustaw budzik w dni robocze na szóstą czterdzieści pięć.", set_alarm, {time: w dni robocze o 6:45}, "repeating"]
