  - ["Ustaw budzik za dwadzieścia minut.", set_alarm, {time: za 20 minut}, "from now"]
  - ["Obudź mnie za osiem godzin.", set_alarm, {time: za 8 godzin}, "from now, hours"]
  - ["Anuluj budzik na jutro.", cancel_alarm, {time: jutro}, "a day alone"]
  - ["Anuluj budzik na siódmą.", cancel_alarm, {time: siódmą}, "a time after budzik"]
