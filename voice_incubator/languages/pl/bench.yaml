  - ["Anuluj moje przypomnienie.", cancel_reminder, {}, "the only one, or which"]
  - ["Co mam dzisiaj w kalendarzu?", my_calendar, {}, "the speaker's calendar"]
  - ["Ustaw budzik we wtorek na szóstą.", set_alarm, {time: we wtorek na szóstą}, "starts with we (WHEN_STARTS)"]
  - ["Przypomnij mi w piątek o dziewiątej zadzwonić do mamy.", remind_me, {reminder: w piątek o 9 zadzwonić do mamy}, "starts with w (WHEN_STARTS)"]
