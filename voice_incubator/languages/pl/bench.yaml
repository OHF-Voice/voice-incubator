  - ["Jakie mam przypomnienia?", reminder_status, {}, "an example sentence"]
  - ["Przypomnij mi o siedemnastej, żebym zadzwonił do mamy.", remind_me, {reminder: o 17 żebym zadzwonił do mamy}, "time first, żebym"]
