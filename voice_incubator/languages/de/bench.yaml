  - ["Wie lange läuft der Timer noch?", timer_status, {}, "a timer question"]
  - ["Vergiss es.", never_mind, {}, "an example sentence"]
  # Covers to a position, brighter and dimmer, the white of the lights.
  - ["Stell die Jalousien auf fünfzig Prozent.", cover_position_here, {device_class: blind, percentage: 50}, "covers to a position"]
  - ["Fahr die Rollläden auf dreißig Prozent.", cover_position_here, {device_class: shutter, percentage: 30}, "covers to a position, fahren"]
  - ["Stell das Dachfenster auf dreißig Prozent.", cover_position_device, {entity: [cover.dachfenster], percentage: 30}, "a cover to a position"]
  - ["Mach das Licht heller.", brighter_here, {}, "brighter"]
  - ["Mach die Küchenlampe heller.", brighter_place, {area: [kueche]}, "brighter, a compound"]
  - ["Mach die Stehlampe dunkler.", dimmer_device, {entity: [light.stehlampe]}, "a light dimmer"]
