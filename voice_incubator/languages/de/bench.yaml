  # The thermostat.
  - ["Stell das Thermostat auf einundzwanzig Grad.", set_temperature_here, {temperature: 21}, "the home's thermostat"]
  - ["Dreh die Heizung hoch.", heat_up, {}, "warmer"]
  - ["Dreh die Heizung runter.", heat_down, {}, "cooler"]
